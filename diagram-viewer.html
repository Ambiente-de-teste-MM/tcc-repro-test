<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #161a18;
}

#viewer {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  cursor: grab;
}

#viewer:active {
  cursor: grabbing;
}

#diagram {
  display: block;
  width: 100%;
  height: auto;
  max-width: none;
  user-select: none;
}

.controls {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 100;
  display: flex;
  gap: 6px;
}

.controls button {
  border: 1px solid #777;
  background: #222;
  color: #eee;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="viewer">

  <div class="controls">
    <button type="button" id="zoom-in">+</button>
    <button type="button" id="zoom-out">−</button>
    <button type="button" id="reset">Reset</button>
  </div>

  <img
    id="diagram"
    src="images/test-diagram.svg"
    alt="Test diagram"
    draggable="false"
  >

</div>

<script src="https://unpkg.com/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>

<script>
const element = document.getElementById("diagram");
const viewer = document.getElementById("viewer");

const panzoom = Panzoom(element, {
  maxScale: 12,
  minScale: 0.5,
  step: 0.3
});

viewer.addEventListener(
  "wheel",
  panzoom.zoomWithWheel,
  { passive: false }
);

document.getElementById("zoom-in")
  .addEventListener("click", () => panzoom.zoomIn());

document.getElementById("zoom-out")
  .addEventListener("click", () => panzoom.zoomOut());

document.getElementById("reset")
  .addEventListener("click", () => panzoom.reset());
</script>

</body>
</html>
